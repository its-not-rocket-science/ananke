<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ananke favicon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="62%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>
    <linearGradient id="ring" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="thread" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- deterministic orbit / fate-wheel -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Ananke A / causal thread -->
  <path d="M18 47 L32 15 L46 47" fill="none" stroke="url(#thread)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 35 H40" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>

  <!-- fixed-point nodes -->
  <circle cx="32" cy="15" r="3.3" fill="#e5e7eb"/>
  <circle cx="18" cy="47" r="3.3" fill="#7dd3fc"/>
  <circle cx="46" cy="47" r="3.3" fill="#a78bfa"/>
  <circle cx="32" cy="32" r="2.4" fill="#fbbf24"/>
</svg>
